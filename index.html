        blob2: { position: "fixed", bottom: "-20%", right: "-15%", width: "500px", height: "500px", borderRadius: "50%", background: "radial-gradient(circle, rgba(255,200,170,0.45) 0%, transparent 65%)", pointerEvents: "none", zIndex: 0 },
        page: { position: "relative", zIndex: 1, width: "100%", maxWidth: "430px", margin: "0 auto", padding: "1.5rem 1rem 3rem" },
        card: { background: "rgba(255,255,255,0.65)", border: "1px solid rgba(255,150,190,0.3)", borderRadius: "28px", padding: "2rem 1.5rem", boxShadow: "0 8px 40px rgba(220,100,150,0.12)" },
        photoWrap: { display: "flex", justifyContent: "center", marginBottom: "0.75rem" },
        photo: { width: "190px", objectFit: "contain", filter: "drop-shadow(0 4px 24px rgba(220,100,150,0.25))" },
        title: { fontSize: "clamp(1.6rem, 6vw, 2.2rem)", fontWeight: "700", lineHeight: 1.2, margin: "0 0 1rem", color: "#3d1a2e", textAlign: "center" },
        pink: { color: "#e8487a", fontStyle: "italic" },
        eventPill: { display: "flex", flexWrap: "wrap", justifyContent: "center", gap: "0.4rem", background: "rgba(255,150,190,0.12)", border: "1px solid rgba(255,150,190,0.35)", borderRadius: "999px", padding: "0.55rem 1rem", fontSize: "0.78rem", color: "rgba(160,60,100,0.85)", marginBottom: "1rem" },
        dot: { color: "rgba(220,130,160,0.4)" },
        fine: { fontSize: "0.84rem", color: "rgba(100,40,70,0.5)", lineHeight: 1.65, textAlign: "center", margin: "0 0 1.25rem" },
        label: { display: "block", fontSize: "0.8rem", color: "rgba(120,50,80,0.65)", marginBottom: "0.4rem" },
        input: { width: "100%", background: "rgba(255,255,255,0.7)", border: "1px solid rgba(255,150,190,0.35)", borderRadius: "14px", padding: "0.9rem 1rem", fontSize: "1rem", color: "#3d1a2e", outline: "none" },
        inputErr: { borderColor: "#f87171" },
        errMsg: { color: "#e05555", fontSize: "0.78rem", marginTop: "0.35rem" },
        btn: { width: "100%", background: "linear-gradient(135deg, #f06292, #ffb347)", color: "#fff", border: "none", borderRadius: "16px", padding: "1rem", fontSize: "1rem", fontWeight: "700", cursor: "pointer", marginTop: "1.25rem", boxShadow: "0 6px 24px rgba(240,98,146,0.3)" },
        btnOff: { opacity: 0.35, cursor: "not-allowed", boxShadow: "none" },
        disclaimer: { textAlign: "center", marginTop: "0.85rem", fontSize: "0.67rem", color: "rgba(120,50,80,0.35)", lineHeight: 1.55 },
        progressWrap: { height: "3px", background: "rgba(220,130,160,0.15)", borderRadius: "99px", marginBottom: "1.25rem", overflow: "hidden" },
        progressBar: { height: "100%", background: "linear-gradient(90deg, #f06292, #ffb347)", borderRadius: "99px", transition: "width 0.4s ease" },
        qMeta: { fontSize: "0.7rem", color: "rgba(160,70,110,0.5)", letterSpacing: "0.1em", textTransform: "uppercase", textAlign: "center", marginBottom: "0.6rem" },
        qEmoji: { fontSize: "2.8rem", textAlign: "center", lineHeight: 1, marginBottom: "0.6rem" },
        question: { fontSize: "clamp(1.05rem, 4vw, 1.2rem)", fontWeight: "600", color: "#3d1a2e", margin: "0 0 0.3rem", lineHeight: 1.45, textAlign: "center" },
        questionSub: { fontSize: "0.72rem", color: "rgba(100,40,70,0.45)", textAlign: "center", margin: "0 0 1rem", fontStyle: "italic" },
        options: { display: "flex", flexDirection: "column", gap: "0.55rem" },
        option: { background: "rgba(255,255,255,0.6)", border: "1px solid rgba(255,150,190,0.25)", color: "rgba(80,30,55,0.88)", borderRadius: "14px", padding: "0.9rem 1rem", fontSize: "0.92rem", textAlign: "left", cursor: "pointer", lineHeight: 1.45 },
        optionOn: { background: "rgba(240,98,146,0.12)", border: "1px solid rgba(240,98,146,0.5)", color: "#3d1a2e" },
        dietDesc: { fontSize: "0.9rem", color: "rgba(100,40,70,0.55)", lineHeight: 1.65, textAlign: "center", margin: "0 0 1rem" },
        textarea: { width: "100%", background: "rgba(255,255,255,0.7)", border: "1px solid rgba(255,150,190,0.35)", borderRadius: "14px", padding: "0.9rem 1rem", fontSize: "0.92rem", color: "#3d1a2e", outline: "none", resize: "none", lineHeight: 1.55 },
        resultTop: { display: "flex", flexDirection: "column", alignItems: "center", marginBottom: "0.5rem" },
        photoSmall: { width: "80px", objectFit: "contain", filter: "drop-shadow(0 4px 16px rgba(220,100,150,0.2))", marginBottom: "0.5rem" },
        resultTitle: { fontSize: "clamp(1.2rem, 5vw, 1.6rem)", fontWeight: "700", color: "#3d1a2e", textAlign: "center", margin: "0 0 1rem", lineHeight: 1.35 },
        resultDesc: { fontSize: "0.92rem", color: "rgba(80,30,55,0.75)", lineHeight: 1.75, textAlign: "center", margin: "0 0 1.25rem" },
        btnAlt: { width: "100%", background: "rgba(200,80,120,0.1)", color: "#3d1a2e", border: "1px solid rgba(220,100,150,0.2)", borderRadius: "16px", padding: "1rem", fontSize: "1rem", fontWeight: "700", cursor: "pointer", marginTop: "1.25rem" },
      };

      return (
        <div style={s.root}>
          <div style={s.blob1} /><div style={s.blob2} />

          {screen === "intro" && (
            <div style={s.page}><div style={s.card}>
              <div style={s.photoWrap}>
                <img src={HOST_PHOTO} alt="Host" style={s.photo} />
              </div>
              <h1 style={s.title}>I have a <span style={s.pink}>Work Dinner Dance</span> & I'm accepting applications.</h1>
              <div style={s.eventPill}>
                <span>📅 Sat 13 Jun</span><span style={s.dot}>·</span>
                <span>🕢 6:30pm–10pm</span><span style={s.dot}>·</span>
                <span>📍 Southbank, Bris</span>
              </div>
              <p style={s.fine}>Two-course dinner, soft drinks, live music, dancing, raffle & silent auction.<br/>Before I formally extend this invitation, I need to vet you. Seven questions.</p>
              <div>
                <label style={s.label}>Your name, please:</label>
                <input style={{...s.input, ...(nameError ? s.inputErr : {})}} type="text" placeholder="Full legal name preferred"
                  value={nameInput} onChange={e => { setNameInput(e.target.value); setNameError(false); }}
                  onKeyDown={e => e.key === "Enter" && handleStart()} />
                {nameError && <p style={s.errMsg}>We need a name. Non-negotiable. 🌸</p>}
              </div>
              <button style={s.btn} onClick={handleStart}>Apply Now →</button>
              <p style={s.disclaimer}>* Results are binding. No appeals accepted. This is not a legally binding event invitation.</p>
            </div></div>
          )}

          {screen === "quiz" && (
            <div style={s.page}><div style={s.card}>
              <div style={s.progressWrap}><div style={{...s.progressBar, width: progress + "%"}} /></div>
              <div style={s.qMeta}>{firstName} · Question {current + 1} of {total}</div>
              <div style={{opacity: animating ? 0 : 1, transition: "opacity 0.25s"}}>
                <div style={s.qEmoji}>{questions[current].emoji}</div>
                <h2 style={s.question}>{questions[current].question}</h2>
                {questions[current].questionSub && <p style={s.questionSub}>{questions[current].questionSub}</p>}
                <div style={s.options}>
                  {questions[current].options.map(opt => (
                    <button key={opt.value} onClick={() => handleSelect(opt.value)}
                      style={{...s.option, ...(selected === opt.value ? s.optionOn : {})}}>
                      {opt.label}
                    </button>
                  ))}
                </div>
                <button style={{...s.btn, ...(selected ? {} : s.btnOff)}} onClick={handleNext} disabled={!selected}>
                  {current + 1 === total ? "Almost done →" : "Next →"}
                </button>
              </div>
            </div></div>
          )}

          {screen === "dietary" && (
            <div style={s.page}><div style={s.card}>
              <div style={s.qEmoji}>🍽️</div>
              <h2 style={s.question}>One last thing, {firstName}.</h2>
              <p style={s.dietDesc}>It's a two-course dinner, any dietary requirements I should know about?</p>
              <textarea style={s.textarea} rows={3} placeholder="e.g. vegetarian, gluten free, nut allergy… or just 'none, I eat everything'"
                value={dietary} onChange={e => setDietary(e.target.value)} />
              <button style={s.btn} onClick={handleSubmit} disabled={saving}>
                {saving ? "Submitting... ⏳" : "Submit Application →"}
              </button>
              {saveError && <p style={s.errMsg}>Couldn't save but your result still counts!</p>}
            </div></div>
          )}

          {screen === "result" && finalResult && (
            <div style={s.page}><div style={s.card}>
              <div style={s.resultTop}>
                <img src={HOST_PHOTO} alt="Host" style={s.photoSmall} />
              </div>
              <h2 style={s.resultTitle}>
                {firstName},<br/>
                <span style={{color: finalResult.color}}>{finalResult.title}</span>
              </h2>
              <p style={s.resultDesc}>{finalResult.description}</p>
              <button style={s.btnAlt} onClick={handleRetake}>Someone else wants to apply 🔄</button>
              <p style={s.disclaimer}>Results are entirely at the discretion of the host. No correspondence will be entered into.</p>
            </div></div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
